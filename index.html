<script>
  // Rutas de las canciones en tu carpeta "musica/"
  const arxiusMP3 = [
    "musica/Alberto_balsalm.mp3"
  ];

  // Ejecutamos el código una vez cargado todo el DOM
  document.addEventListener('DOMContentLoaded', () => {
    const audioPlayer = document.getElementById('audio-player');
    const currentTitle = document.getElementById('current-title');
    const playlist = document.getElementById('playlist');

    // Función para extraer y limpiar el nombre
    function extreureTitol(ruta) {
      const nomArxiu = ruta.split('/').pop();
      return nomArxiu.replace('.mp3', '').replace(/_/g, ' ');
    }

    // Comprobar que la lista existe en el DOM
    if (playlist) {
      arxiusMP3.forEach((ruta) => {
        const li = document.createElement('li');
        li.className = 'song-item';
        li.textContent = extreureTitol(ruta);

        li.addEventListener('click', () => {
          audioPlayer.src = ruta;
          audioPlayer.play();
          currentTitle.textContent = extreureTitol(ruta);

          document.querySelectorAll('.song-item').forEach(item => item.classList.remove('active'));
          li.classList.add('active');
        });

        playlist.appendChild(li);
      });
    }
  });
</script>
