<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGUERDA-MU | Reproductor de Música</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #1db954;
      --secondary-text: #b3b3b3;
      --hover-bg: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 2px;
      font-size: 2em;
    }

    /* Reproductor Principal */
    .player-card {
      background-color: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 25px;
      text-align: center;
    }

    .now-playing {
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--secondary-text);
      margin-bottom: 8px;
    }

    .song-title {
      font-size: 1.3em;
      font-weight: bold;
      margin-bottom: 18px;
      color: var(--text-color);
      word-break: break-word;
    }

    audio {
      width: 100%;
      border-radius: 8px;
      outline: none;
    }

    /* Lista de Canciones */
    .playlist-title {
      font-size: 1em;
      color: var(--secondary-text);
      margin-bottom: 12px;
      padding-left: 5px;
    }

    .playlist {
      list-style: none;
    }

    .song-item {
      background-color: var(--card-bg);
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      border-left: 4px solid transparent;
    }

    .song-item:hover {
      background-color: var(--hover-bg);
      transform: translateY(-2px);
    }

    .song-item.active {
      border-left-color: var(--accent-color);
      color: var(--accent-color);
      font-weight: bold;
      background-color: var(--hover-bg);
    }

    .play-icon {
      font-size: 0.9em;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>LEGUERDA-MU</h1>

    <!-- Reproductor Principal -->
    <div class="player-card">
      <div class="now-playing">Reproduciendo ahora</div>
      <div class="song-title" id="current-title">Selecciona una canción</div>
      <audio id="audio-player" controls preload="metadata">
        Tu navegador no soporta el reproductor de audio.
      </audio>
    </div>

    <!-- Lista de Canciones -->
    <div class="playlist-title">Lista de reproducción</div>
    <ul class="playlist" id="playlist">
      <!-- Las canciones se cargarán automáticamente con JavaScript -->
    </ul>
  </div>
